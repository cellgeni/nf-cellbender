$schema: https://raw.githubusercontent.com/nextflow-io/schemas/refs/heads/main/module/v1/schema.json
name: cellgeni/cellbender/qc
version: 0.4.0
description: >
  Collects QC statistics from a group of CellBender 0.2 and 0.3 remove-background outputs into a
  summary TSV, a multi-page PDF (training curves, CellBender-style cell calling, latent PCA, soup
  fractions and per-gene removal) and MultiQC custom content.
keywords:
  - cellbender
  - single-cell
  - quality control
  - multiqc
license: MIT
authors:
  - "@claptar"
maintainers:
  - "@claptar"
requires:
  nextflow: ">=25.04.0"
tools:
  - cellbender:
      description: "A software package for eliminating technical artifacts from high-throughput single-cell RNA sequencing data."
      homepage: "https://cellbender.readthedocs.io/en/latest/"
      licence:
        - "BSD-3-Clause"
input:
  - - name: meta
      type: map
      description: "Map with metadata of the group of samples (dataset) that is checked together. Must contain key 'id' with the group name, e.g. [ id:'dataset1' ]"
    - name: cellbender_output
      type: directory
      description: "CellBender output directories of the group, one per sample (named after the sample), staged under cellbender_output/."
output:
  - - name: meta
      type: map
      description: "Map with group metadata, passed through from input."
    - name: report
      type: directory
      description: "qc_report/ with cellbender_qc_summary.tsv, cellbender_qc_report.pdf and multiqc/."
      pattern: "qc_report"
  - - name: meta
      type: map
      description: "Map with group metadata, passed through from input."
    - name: multiqc_files
      type: file
      description: "MultiQC custom content: summary table, general stats, ELBO and soup fraction histogram line graphs, and images of the cell calling, latent PCA, soup fraction and gene removal plots."
      pattern: "qc_report/multiqc/*_mqc.*"
  - - name: process
      type: string
      description: "The process the version was collected from (the versions topic)."
    - name: tool
      type: string
      description: "The tool name, python."
    - name: version
      type: string
      description: "The python version."
  - - name: process
      type: string
      description: "The process the version was collected from (the versions topic)."
    - name: tool
      type: string
      description: "The tool name, h5py."
    - name: version
      type: string
      description: "The h5py version."
  - - name: process
      type: string
      description: "The process the version was collected from (the versions topic)."
    - name: tool
      type: string
      description: "The tool name, matplotlib."
    - name: version
      type: string
      description: "The matplotlib version."
  - - name: process
      type: string
      description: "The process the version was collected from (the versions topic)."
    - name: tool
      type: string
      description: "The tool name, numpy."
    - name: version
      type: string
      description: "The numpy version."
  - - name: process
      type: string
      description: "The process the version was collected from (the versions topic)."
    - name: tool
      type: string
      description: "The tool name, pandas."
    - name: version
      type: string
      description: "The pandas version."
topics:
