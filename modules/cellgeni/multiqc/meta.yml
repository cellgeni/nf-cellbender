$schema: https://raw.githubusercontent.com/nextflow-io/schemas/refs/heads/main/module/v1/schema.json
name: cellgeni/multiqc
version: 0.1.0
description: >
  Aggregates tool outputs and MultiQC custom content (*_mqc.* files) into a single HTML report,
  with a fixed output layout (multiqc_report.html and multiqc_data/) whatever the report title.
keywords:
  - multiqc
  - qc
  - report
  - custom content
license: MIT
authors:
  - "@claptar"
maintainers:
  - "@claptar"
requires:
  nextflow: ">=25.04.0"
tools:
  - multiqc:
      description: "Aggregate results from bioinformatics analyses across many samples into a single report."
      homepage: "https://seqera.io/multiqc/"
      documentation: "https://docs.seqera.io/multiqc"
      tool_dev_url: "https://github.com/MultiQC/MultiQC"
      doi: "10.1093/bioinformatics/btw354"
      licence:
        - "GPL-3.0-or-later"
input:
  - name: multiqc_files
    type: file
    description: "Files for MultiQC to search: tool outputs and/or custom content (*_mqc.json, *_mqc.tsv, *_mqc.png, ...). Staged under multiqc_input/."
  - name: multiqc_config
    type: file
    description: "Optional MultiQC config YAML (report title, section order, custom content settings). Pass [] to use the defaults."
    pattern: "*.{yml,yaml}"
output:
  - name: report
    type: file
    description: "The MultiQC HTML report."
    pattern: "multiqc_report.html"
  - name: data
    type: directory
    description: "Parsed data, plot data and logs behind the report."
    pattern: "multiqc_data"
  - name: versions
    type: file
    description: "YAML file recording the MultiQC version."
    pattern: "versions.yml"
