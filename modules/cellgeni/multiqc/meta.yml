$schema: https://raw.githubusercontent.com/nextflow-io/schemas/refs/heads/main/module/v1/schema.json
name: cellgeni/multiqc
version: 0.3.0
description: >
  Aggregates tool outputs and MultiQC custom content (*_mqc.* files) into an HTML report per meta
  map, with a fixed output layout (multiqc_report.html and multiqc_data/) whatever the report title.
keywords:
  - multiqc
  - qc
  - report
  - custom content
license: MIT
authors:
  - "@claptar"
maintainers:
  - "@claptar"
requires:
  nextflow: ">=25.04.0"
tools:
  - multiqc:
      description: "Aggregate results from bioinformatics analyses across many samples into a single report."
      homepage: "https://seqera.io/multiqc/"
      documentation: "https://docs.seqera.io/multiqc"
      tool_dev_url: "https://github.com/MultiQC/MultiQC"
      doi: "10.1093/bioinformatics/btw354"
      licence:
        - "GPL-3.0-or-later"
input:
  - - name: meta
      type: map
      description: "Map with metadata of the report, e.g. the group of samples it covers. Must contain key 'id', e.g. [ id:'dataset1' ]"
    - name: multiqc_files
      type: file
      description: "Files for MultiQC to search: tool outputs and/or custom content (*_mqc.json, *_mqc.tsv, *_mqc.png, ...). Staged under multiqc_input/."
  - name: multiqc_config
    type: file
    description: "Optional MultiQC config YAML (report title, section order, custom content settings). Pass [] to use the defaults."
    pattern: "*.{yml,yaml}"
output:
  - - name: meta
      type: map
      description: "Map with report metadata, passed through from input."
    - name: report
      type: file
      description: "The MultiQC HTML report."
      pattern: "multiqc_report.html"
  - - name: meta
      type: map
      description: "Map with report metadata, passed through from input."
    - name: data
      type: directory
      description: "Parsed data, plot data and logs behind the report."
      pattern: "multiqc_data"
  - - name: process
      type: string
      description: "The process the version was collected from (the versions topic)."
    - name: tool
      type: string
      description: "The tool name, multiqc."
    - name: version
      type: string
      description: "The MultiQC version."
topics:
  - - name: process
      type: string
      description: "versions topic: the process the version was collected from."
    - name: tool
      type: string
      description: "versions topic: the tool name."
    - name: version
      type: string
      description: "versions topic: the tool version."
